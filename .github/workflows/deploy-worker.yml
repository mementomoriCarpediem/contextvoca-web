# contextvoca.app 정본 배포: main push → 빌드 → wrangler deploy (Worker contextvoca-web)
# 로컬에서 `wrangler deploy`를 병행하지 말 것 — 배포가 겹치면 엣지 매니페스트가 갈린다.
# 보안: 액션은 커밋 SHA로 고정(공개 레포). 시크릿 CLOUDFLARE_API_TOKEN은 Workers 배포에만 쓰이며
# main 브랜치 push에서만 실행된다(포크 PR에는 시크릿이 노출되지 않음).
name: Deploy to Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: node scripts/check-i18n-keys.mjs
      - run: yarn build
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
