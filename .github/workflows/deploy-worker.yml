# contextvoca.app 정본 배포: main push → 빌드 → wrangler deploy (Worker contextvoca-web)
# 로컬에서 `wrangler deploy`를 병행하지 말 것 — 배포가 겹치면 엣지 매니페스트가 갈린다.
# 보안: 액션은 커밋 SHA로 고정(공개 레포). 시크릿 CLOUDFLARE_API_TOKEN은 Workers 배포에만 쓰이며
# main 브랜치 push에서만 실행된다(포크 PR에는 시크릿이 노출되지 않음).
name: Deploy to Cloudflare Worker
# 대표님 전역 규칙(2026-10-30, 전 프로젝트): GitHub Actions는 배포만. 시험(i18n 키 검사·단위 시험)은 로컬 `local-gate`
# (전체 = `yarn gate`, 아니면 영향 범위만 --cmd/--why)에서 돌리고, push 전 훅이 기록 없는 main push를 막는다. 여기서는 설치·빌드·
# 빌드 산출물(OG 이미지) 확인·배포만 한다. 문서·일지만 바뀐 push는 배포하지 않는다(본문은 content/**의 .md라 *.md 전체를 빼지 않는다).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".resonance/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # v5부터 package.json의 packageManager를 보고 캐시를 자동 활성화한다.
          # 이 워크플로는 setup-node 다음에 corepack enable을 하므로 그 시점에 yarn이
          # 없어 캐시 경로 탐색이 실패한다 — 기존(캐시 없음) 동작을 명시적으로 유지.
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      # i18n 키 검사와 단위 시험(OG 카드 slug별 유일성·팔레트·글리프)은 로컬 관문(`yarn gate`)으로 옮겼다(2026-10-30).
      - run: yarn build
      # 빌드 산출물(out/) 대조 — 발행 글마다 1200x675 OG 이미지가 존재하고
      # og:image/twitter:image/JSON-LD가 그 URL을 가리키는지, draft 페이지에는
      # 이미지가 없는지 확인한다. 어긋나면 배포 전에 실패한다.
      - run: node scripts/check-og-images.mjs
      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v4의 기본 wrangler는 "latest"다. 배포 재현성을 위해 명시 고정한다.
          wranglerVersion: "4.127.1"
